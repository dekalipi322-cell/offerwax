<!doctype html><meta name="viewport" content="width=device-width,initial-scale=1"><title>Offerwax Admin</title><style>body{font-family:Arial;background:#effaff;color:#08265d;padding:18px}main{max-width:650px;margin:auto}section{background:#fff;padding:20px;border-radius:18px;margin:14px 0}input,button{box-sizing:border-box;width:100%;padding:13px;margin:5px 0;border-radius:10px;border:1px solid #ccdce8}button{background:#078bf1;color:#fff;border:0;font-weight:bold}.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}</style><main><h1>Offerwax Admin</h1><section id="gate"><h2>Admin Login</h2><input id="p" type="password"><button onclick="unlock()">Login</button></section><div id="panel" hidden><section><h2>Dashboard values</h2><div class="grid"><input id="today" placeholder="Today's earnings"><input id="refs" placeholder="Total referrals"><input id="active" placeholder="Active users"><input id="total" placeholder="Total earnings"><input id="offers" placeholder="Live offers"><input id="link" placeholder="Referral link"></div></section><section><h2>Recent Activity</h2><div id="acts"></div></section><button onclick="save()">Save changes</button></div></main><script>const base={today:"₹1,350",refs:"18",active:"12",total:"₹5,840",offers:"8",link:"https://offerwax.com/r/AL7K9",a:[["JM","Jessica M.","Completed Angel One Offer","2h ago","+₹200"],["RT","Ryan T.","Signed up via your link","5h ago","+₹50"],["SL","Samantha L.","Completed Upstox Offer","1d ago","+₹200"],["DK","Daniel K.","Completed Google Review","2d ago","+₹20"]]};let d={...base,...JSON.parse(localStorage.getItem("ow")||"{}")};function unlock(){if(p.value==="admin123"){gate.hidden=true;panel.hidden=false;load()}}function load(){["today","refs","active","total","offers","link"].forEach(k=>document.getElementById(k).value=d[k]);acts.innerHTML=d.a.map((x,i)=>`<div class=grid><input value="${x[1]}" oninput="d.a[${i}][1]=this.value"><input value="${x[2]}" oninput="d.a[${i}][2]=this.value"><input value="${x[3]}" oninput="d.a[${i}][3]=this.value"><input value="${x[4]}" oninput="d.a[${i}][4]=this.value"></div><hr>`).join("")}function save(){["today","refs","active","total","offers","link"].forEach(k=>d[k]=document.getElementById(k).value);localStorage.setItem("ow",JSON.stringify(d));alert("Saved")}</script>
