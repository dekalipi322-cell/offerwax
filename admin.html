<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Offerwax Admin</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#f4f8fc;color:#10264b}.wrap{max-width:900px;margin:auto;padding:25px}.card{background:#fff;padding:22px;border-radius:18px;margin:15px 0;box-shadow:0 7px 25px #174a7a12}.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}label{font-size:13px;font-weight:bold}input{width:100%;padding:13px;border:1px solid #ccd8e6;border-radius:10px;margin:6px 0 12px}button{background:#087cf0;color:#fff;border:0;padding:14px 20px;border-radius:11px;font-weight:bold}.row{display:grid;grid-template-columns:1.1fr 2fr .7fr .8fr auto;gap:8px;align-items:center}.danger{background:#e64c4c}.lock{position:fixed;inset:0;background:#edf7ff;display:grid;place-items:center;z-index:9}.login{background:white;padding:28px;border-radius:20px;width:min(90%,360px)}@media(max-width:650px){.grid{grid-template-columns:1fr}.row{grid-template-columns:1fr}.wrap{padding:12px}}</style></head><body>
<div class="lock" id="lock"><div class="login"><h2>Offerwax Admin</h2><input id="ap" type="password" placeholder="Admin password"><button onclick="alogin()">Login</button><p id="e" style="color:red"></p></div></div>
<div class="wrap"><h1>Offerwax Admin Panel</h1><div class="card grid">
<div><label>Today's Referral Earnings</label><input id="today"></div><div><label>Total Referrals</label><input id="referrals"></div><div><label>Active Users</label><input id="active"></div><div><label>Total Earnings</label><input id="total"></div><div><label>Live Offers</label><input id="offers"></div><div><label>Referral Link</label><input id="link"></div></div>
<div class="card"><h2>Recent Activity</h2><div id="rows"></div><button onclick="add()">+ Add Activity</button></div>
<div class="card"><h2>Passwords</h2><div class="grid"><div><label>Website Password</label><input id="sitepw" type="password"></div><div><label>Admin Password</label><input id="adminpw" type="password"></div></div></div>
<button onclick="save()" style="width:100%;font-size:18px">Save All Changes</button><p id="msg"></p></div>
<script>
const DEF={today:"₹1,350",referrals:"18",active:"12",total:"₹5,840",offers:"8",link:"https://offerwax.com/r/AL7K9",activities:[{name:"Jessica M.",offer:"Completed Angel One Offer",time:"2h ago",amount:"+₹200"},{name:"Ryan T.",offer:"Signed up via your link",time:"5h ago",amount:"+₹50"},{name:"Samantha L.",offer:"Completed Upstox Offer",time:"1d ago",amount:"+₹200"},{name:"Daniel K.",offer:"Completed Google Review",time:"2d ago",amount:"+₹20"}]};
let d;try{d={...DEF,...JSON.parse(localStorage.getItem("offerwaxData")||"{}")}}catch(e){d=DEF}
function alogin(){let p=localStorage.getItem("offerwaxAdminPassword")||"admin123";if(ap.value===p){sessionStorage.setItem("owadmin","1");lock.style.display="none"}else e.textContent="Wrong password"}
if(sessionStorage.getItem("owadmin")==="1")lock.style.display="none";
["today","referrals","active","total","offers","link"].forEach(k=>document.getElementById(k).value=d[k]);sitepw.value=localStorage.getItem("offerwaxSitePassword")||"offerwax123";adminpw.value=localStorage.getItem("offerwaxAdminPassword")||"admin123";
function draw(){rows.innerHTML=(d.activities||[]).map((x,i)=>`<div class="row"><input data-i="${i}" data-k="name" value="${x.name}"><input data-i="${i}" data-k="offer" value="${x.offer}"><input data-i="${i}" data-k="time" value="${x.time}"><input data-i="${i}" data-k="amount" value="${x.amount}"><button class="danger" onclick="del(${i})">×</button></div>`).join("")}draw();
function syncRows(){document.querySelectorAll("#rows input").forEach(el=>d.activities[+el.dataset.i][el.dataset.k]=el.value)}
function add(){syncRows();d.activities.push({name:"New User",offer:"Completed Offer",time:"now",amount:"+₹0"});draw()}function del(i){syncRows();d.activities.splice(i,1);draw()}
function save(){syncRows();["today","referrals","active","total","offers","link"].forEach(k=>d[k]=document.getElementById(k).value);localStorage.setItem("offerwaxData",JSON.stringify(d));localStorage.setItem("offerwaxSitePassword",sitepw.value);localStorage.setItem("offerwaxAdminPassword",adminpw.value);msg.textContent="✓ Saved. Open/refresh index.html to see changes."}
</script></body></html>
